name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  check-types:
    name: Type-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check-types

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Testcontainers starts Postgres through the runner's Docker.
      - run: pnpm exec turbo run test --ui=stream --filter='!dashboard'

  test-dashboard:
    name: Dashboard tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The dashboard's tests wait on rendering with real-time timeouts, so
      # they run on their own runner rather than competing with Postgres and
      # the API tests for its CPUs (#99).
      - run: pnpm exec turbo run test --ui=stream --filter=dashboard

  smoke:
    name: Smoke test (Docker)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter e2e
      # The image built from this commit, its Postgres, and Mailpit, as a
      # self-hoster runs them (e2e/smoke.env holds the throwaway settings).
      # Chromium installs while the image builds.
      - name: Start the app, and install Chromium
        run: |
          pnpm --filter e2e exec playwright install --with-deps chromium &
          chromium=$!
          docker compose -p mailquilt-smoke --env-file e2e/smoke.env -f compose.yaml -f compose.test.yaml up -d --build --wait
          wait "$chromium"
      # compose.yaml passes on only the settings it names, so check that an
      # optional one from the env file reaches the app (#148).
      - run: test "$(docker compose -p mailquilt-smoke --env-file e2e/smoke.env -f compose.yaml -f compose.test.yaml exec -T app printenv BLOCK_PRIVATE_NETWORKS)" = false
      - run: pnpm --filter e2e smoke
      - if: failure()
        run: docker compose -p mailquilt-smoke --env-file e2e/smoke.env -f compose.yaml -f compose.test.yaml logs

  smoke-cloudflare:
    name: Smoke test (Cloudflare)
    runs-on: ubuntu-24.04
    # Postgres stands in for Hyperdrive's origin, and Mailpit for the SMTP
    # server; wrangler dev runs the Worker, its Queue and its consumer locally.
    services:
      postgres:
        image: postgres:18.7-alpine@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
        env:
          POSTGRES_PASSWORD: smoke-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "true"
          MP_SMTP_AUTH_ALLOW_INSECURE: "true"
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgres://postgres:smoke-test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter dashboard build
      # As the deploy step does, before the Worker starts.
      - run: pnpm --filter @repo/db migrate
      - name: Start wrangler dev
        working-directory: apps/api-worker
        env:
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: ${{ env.DATABASE_URL }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -a
          . ../../e2e/smoke.env
          set +a
          ./node_modules/.bin/wrangler dev --port 8787 \
            --var "AUTH_SECRET:$AUTH_SECRET" \
            --var "ENCRYPTION_KEYS:$ENCRYPTION_KEYS" \
            --var "DEV_DNS_RECORDS:$DEV_DNS_RECORDS" \
            > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          for attempt in $(seq 1 60); do
            curl -fs http://localhost:8787/health && exit 0
            sleep 1
          done
          exit 1
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      # workerd looks names up over DNS, not in /etc/hosts, so Mailpit is
      # reached by its address.
      - run: pnpm --filter e2e smoke
        env:
          MAILQUILT_URL: http://localhost:8787
          MAILPIT_URL: http://localhost:8025
          MAILPIT_SMTP_HOST: 127.0.0.1
          MAILPIT_SMTP_PORT: "1025"
      - if: failure()
        run: cat "$RUNNER_TEMP/wrangler.log"

  audit:
    name: Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Reads pnpm-lock.yaml, so it needs no install. Ignored advisories are
      # listed under `audit` in pnpm-workspace.yaml.
      - run: pnpm audit

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    env:
      # Updated by hand, like every dependency.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" gitleaks
      # Scans every commit. Accepted false positives are in .gitleaksignore.
      - run: ./gitleaks git --redact --no-banner --verbose .
